<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>嵌入式Web应用</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 10px 0;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
        }
        #result2 {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <h1>嵌入式Web应用演示</h1>
    <button onclick="callApi()">调用嵌入式API - TestController</button>
    <div id="result"></div>
    <br />
    <br />
    <br />
    <button onclick="callApi2()">调用嵌入式API - DataController</button>
    <div id="result2"></div>

    <script>
        async function callApi() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '请求中...';

            try {
                const response = await fetch('/api/test');
                const data = await response.json();

                resultDiv.innerHTML = `
                                    <strong>API响应：</strong><br>
                                    ${data.message}<br>
                                    <small>时间: ${data.time}</small>
                                `;
            } catch (error) {
                resultDiv.innerHTML = `<strong>错误：</strong> ${error.message}`;
            }
        }

        async function callApi2() {
            const resultDiv = document.getElementById('result2');
            resultDiv.innerHTML = '请求中...';

            try {
                const response = await fetch('/api/data');
                const data = await response.json();

                resultDiv.innerHTML = `
                                    <strong>API响应：</strong><br>
                                    ${data.message}<br>
                                    <small>时间: ${data.time}</small>
                                `;
            } catch (error) {
                resultDiv.innerHTML = `<strong>错误：</strong> ${error.message}`;
            }
        }
    </script>
</body>
</html>
